<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clareza - Diagnóstico Empreendedor</title>

  <!-- Biblioteca de Ícones (Iconify) -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

  <!-- Fontes Google: Playfair Display (Títulos) e Inter (Textos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>/* ─────────────────────────────────────────────────────────────
   RESET & VARIÁVEIS
   ───────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #fcfcfd;
  --card-bg: #ffffff;
  --text: #1c1c2e;
  --muted: #6b6b8a;
  --primary: #4a4a8a;
  --primary-hover: #35356a;
  --accent: #8b8bc4;
  --border: #e2e2eb;
  --radius: 24px;
  --shadow: 0 10px 40px rgba(74, 74, 138, 0.08);
}

/* ─────────────────────────────────────────────────────────────
   BASE & BODY
   ───────────────────────────────────────────────────────────── */
html {
  font-size: 16px; /* base para rem */
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh; /* mobile safe */
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(12px, 3vw, 24px);
  line-height: 1.6;
  background-image:
    radial-gradient(circle at 50% 100%, rgba(139, 139, 196, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 90% 10%, rgba(139, 139, 196, 0.1) 0%, transparent 30%);
  background-attachment: fixed;
  overflow-x: hidden;
}

/* ─────────────────────────────────────────────────────────────
   BOTÃO INVISÍVEL DE RESET
   ───────────────────────────────────────────────────────────── */
.reset-btn {
  position: fixed;
  top: 16px;
  right: 16px;
  width: 40px;
  height: 40px;
  background: transparent;
  border: none;
  cursor: pointer;
  z-index: 9999;
  border-radius: 50%;
  transition: background 0.2s, opacity 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.15;
}
.reset-btn:hover {
  opacity: 1;
  background: rgba(74, 74, 138, 0.1);
}
.reset-btn iconify-icon {
  font-size: 1.4rem;
  color: var(--primary);
}

/* ─────────────────────────────────────────────────────────────
   CONTAINER PRINCIPAL
   ───────────────────────────────────────────────────────────── */
.app {
  width: 100%;
  max-width: 800px;
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: clamp(24px, 5vw, 48px);
  min-height: 500px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(226, 226, 235, 0.5);
}

/* ─────────────────────────────────────────────────────────────
   TELA DE CARREGAMENTO
   ───────────────────────────────────────────────────────────── */
.loading-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 28px;
  animation: fadeIn 0.4s ease-out;
  padding: clamp(20px, 5vw, 40px) 20px;
}

.loading-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 1.1rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  color: var(--primary);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.loading-logo iconify-icon {
  font-size: 2rem;
  animation: sparkle 2s ease-in-out infinite;
}

.loading-spinner {
  width: clamp(48px, 10vw, 64px);
  height: clamp(48px, 10vw, 64px);
  border: 4px solid rgba(74, 74, 138, 0.1);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}

.loading-text {
  text-align: center;
}
.loading-text h2 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.2rem, 4vw, 1.6rem);
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
}
.loading-text p {
  color: var(--muted);
  font-size: clamp(0.85rem, 2.5vw, 0.95rem);
}

.loading-bar {
  width: 100%;
  max-width: 320px;
  height: 4px;
  background: rgba(74, 74, 138, 0.1);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}
.loading-bar::after {
  content: '';
  position: absolute;
  left: -40%;
  top: 0;
  height: 100%;
  width: 40%;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
  border-radius: 999px;
  animation: loadingBar 1.6s ease-in-out infinite;
}

/* ─────────────────────────────────────────────────────────────
   TELA INICIAL (INTRO)
   ───────────────────────────────────────────────────────────── */
.intro {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  animation: fadeInSlideUp 0.6s ease-out;
}

.intro .logo-top {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: clamp(1rem, 2.5vw, 1.2rem);
  font-weight: 500;
  letter-spacing: 0.1em;
  color: var(--primary);
  margin-bottom: clamp(24px, 5vw, 40px);
  text-transform: uppercase;
}
.intro .logo-top iconify-icon {
  font-size: 2rem;
  color: var(--primary);
}

.intro h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.8rem, 6vw, 3rem);
  font-weight: 600;
  color: var(--text);
  margin-bottom: clamp(12px, 3vw, 20px);
  line-height: 1.15;
}

.intro p.subtitle {
  color: var(--muted);
  margin-bottom: clamp(20px, 4vw, 32px);
  font-size: clamp(0.95rem, 2.5vw, 1.15rem);
  max-width: 600px;
}

.intro ul {
  list-style: none;
  margin-bottom: clamp(24px, 5vw, 40px);
  width: 100%;
  display: grid;
  grid-template-columns: 1fr;
  gap: clamp(10px, 2vw, 16px);
}
@media (min-width: 480px) {
  .intro ul { grid-template-columns: 1fr 1fr; }
}

.intro ul li {
  color: var(--text);
  font-size: clamp(0.9rem, 2.5vw, 1rem);
  display: flex;
  align-items: center;
  gap: 12px;
}
.intro ul li iconify-icon {
  color: var(--primary);
  font-size: 1.4rem;
  background: rgba(74, 74, 138, 0.08);
  padding: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ─────────────────────────────────────────────────────────────
   PERGUNTA (QUIZ)
   ───────────────────────────────────────────────────────────── */
.question-container {
  animation: fadeInSlideUp 0.4s ease-out;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.header-question {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: clamp(20px, 4vw, 32px);
  font-size: clamp(0.75rem, 2vw, 0.9rem);
  color: var(--muted);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  gap: 12px;
}

.bar-container {
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 999px;
  margin-left: clamp(12px, 3vw, 24px);
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: var(--primary);
  width: 0%;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: 999px;
}

.question-image {
  width: 100%;
  height: clamp(100px, 20vw, 160px);
  border-radius: 16px;
  margin-bottom: clamp(20px, 4vw, 32px);
  background-size: cover;
  background-position: center;
  position: relative;
}
.question-image::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to right, rgba(255,255,255,0.1), rgba(255,255,255,0.4));
  border-radius: 16px;
}

.question h2 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.15rem, 4vw, 1.8rem);
  font-weight: 600;
  margin-bottom: clamp(20px, 4vw, 32px);
  line-height: 1.3;
  color: var(--text);
}

.options {
  display: flex;
  flex-direction: column;
  gap: clamp(8px, 2vw, 12px);
}

.option {
  text-align: left;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: clamp(14px, 3vw, 20px) clamp(16px, 3.5vw, 24px);
  font-size: clamp(0.9rem, 2.5vw, 1.05rem);
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  gap: clamp(12px, 3vw, 20px);
  align-items: center;
  font-family: 'Inter', sans-serif;
}
.option:hover {
  background: #f8f8fc;
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(74, 74, 138, 0.06);
}

.option .icon-box {
  display: flex;
  align-items: center;
  justify-content: center;
  width: clamp(36px, 8vw, 44px);
  height: clamp(36px, 8vw, 44px);
  background: #f0f0f7;
  border-radius: 12px;
  color: var(--primary);
  flex-shrink: 0;
  transition: all 0.2s ease;
}
.option:hover .icon-box {
  background: var(--primary);
  color: #fff;
  transform: scale(1.05);
}
.option .icon-box iconify-icon {
  font-size: clamp(1.2rem, 3vw, 1.5rem);
}

/* ─────────────────────────────────────────────────────────────
   BOTÕES
   ───────────────────────────────────────────────────────────── */
.btn {
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 999px;
  padding: clamp(14px, 3vw, 18px) clamp(24px, 5vw, 36px);
  font-size: clamp(0.95rem, 2.5vw, 1.05rem);
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: 'Inter', sans-serif;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 4px 12px rgba(74, 74, 138, 0.2);
  margin-top: 10px;
  text-align: center;
  line-height: 1.3;
}
.btn:hover {
  background: var(--primary-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(74, 74, 138, 0.3);
}
.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}
.btn-full {
  width: 100%;
}

/* ─────────────────────────────────────────────────────────────
   INPUTS
   ───────────────────────────────────────────────────────────── */
.input-group {
  display: flex;
  flex-direction: column;
  gap: clamp(10px, 2.5vw, 16px);
  margin-bottom: clamp(20px, 4vw, 32px);
  width: 100%;
}
.input-field {
  padding: clamp(14px, 3vw, 18px) clamp(16px, 3.5vw, 24px);
  border: 1px solid var(--border);
  border-radius: 16px;
  font-size: clamp(0.9rem, 2.5vw, 1rem);
  font-family: 'Inter', sans-serif;
  background: #fcfcfd;
  color: var(--text);
  transition: all 0.2s;
  width: 100%;
}
.input-field:focus {
  outline: none;
  border-color: var(--primary);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(74, 74, 138, 0.1);
}
.input-field::placeholder {
  color: var(--muted);
}

/* ─────────────────────────────────────────────────────────────
   RESULTADO
   ───────────────────────────────────────────────────────────── */
.resultado {
  animation: fadeInSlideUp 0.6s ease-out;
}
.resultado .analise {
  color: var(--text);
  font-size: clamp(0.95rem, 2.5vw, 1.05rem);
  line-height: 1.8;
  margin-bottom: clamp(24px, 5vw, 40px);
}
.resultado .analise h3 {
  font-family: 'Playfair Display', serif;
  color: var(--primary);
  font-size: clamp(1.3rem, 4vw, 2rem);
  margin-top: clamp(20px, 4vw, 32px);
  margin-bottom: clamp(8px, 2vw, 16px);
  font-weight: 600;
  line-height: 1.3;
}
.resultado .analise p {
  margin-bottom: clamp(12px, 2.5vw, 20px);
}
.resultado .analise strong {
  color: var(--text);
  font-weight: 600;
}
.resultado .analise hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: clamp(24px, 5vw, 40px) 0;
}
.resultado .analise em {
  color: var(--muted);
  font-style: italic;
}

/* ─────────────────────────────────────────────────────────────
   ERRO
   ───────────────────────────────────────────────────────────── */
.erro {
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: #b91c1c;
  padding: clamp(12px, 3vw, 16px) clamp(16px, 3.5vw, 24px);
  border-radius: 12px;
  font-size: clamp(0.85rem, 2.5vw, 0.95rem);
  margin-bottom: clamp(16px, 3vw, 24px);
}

/* ─────────────────────────────────────────────────────────────
   ANIMAÇÕES
   ───────────────────────────────────────────────────────────── */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeInSlideUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes sparkle {
  0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
  50% { transform: scale(1.2) rotate(15deg); opacity: 0.7; }
}
@keyframes loadingBar {
  0% { left: -40%; }
  100% { left: 100%; }
}

/* ─────────────────────────────────────────────────────────────
   AJUSTES FINOS PARA TELAS MUITO PEQUENAS
   ───────────────────────────────────────────────────────────── */
@media (max-width: 360px) {
  .app { padding: 20px 16px; }
  .question-image { height: 90px; }
  .option { padding: 12px 14px; gap: 10px; }
  .option .icon-box { width: 32px; height: 32px; }
  .btn { padding: 12px 20px; font-size: 0.9rem; }
}

/* ─────────────────────────────────────────────────────────────
   AJUSTES PARA TELAS GRANDES (desktop wide)
   ───────────────────────────────────────────────────────────── */
@media (min-width: 1200px) {
  .app { max-width: 880px; }
}</style>
</head>
<body>
  <!-- Botão invisível de reset (canto superior direito) -->
  <button class="reset-btn" id="reset-btn" title="Resetar teste" aria-label="Resetar">
    <iconify-icon icon="ph:arrow-counter-clockwise-bold"></iconify-icon>
  </button>

  <main class="app" id="app"></main>

  <script>
    const LS_PERGUNTAS = 'diag:perguntas';
    const LS_RESPOSTAS = 'diag:respostas';
    const LS_NOME = 'diag:nome';
    const LS_TELEFONE = 'diag:telefone';
    const LS_INICIADO = 'diag:iniciado';

    const state = {
      iniciado: false,
      perguntas: [],
      indice: 0,
      respostas: {},
      carregando: true,
      erro: null,
      analise: null,
      reutilizado: null,
    };

    const app = document.getElementById('app');

    // ─── Ícones (mantidos iguais) ───
    const ICONES_PERGUNTAS = {
      1: { A: 'ph:anchor-bold', B: 'ph:stack-bold', C: 'ph:lightbulb-bold', D: 'ph:trend-up-bold' },
      2: { A: 'ph:users-bold', B: 'ph:currency-dollar-bold', C: 'ph:megaphone-bold', D: 'ph:compass-bold' },
      3: { A: 'ph:hourglass-bold', B: 'ph:fire-bold', C: 'ph:target-bold', D: 'ph:rocket-launch-bold' },
      4: { A: 'ph:clock-bold', B: 'ph:lightning-bold', C: 'ph:brain-bold', D: 'ph:check-circle-bold' },
      5: { A: 'ph:funnel-bold', B: 'ph:receipt-bold', C: 'ph:chart-line-up-bold', D: 'ph:bank-bold' },
      6: { A: 'ph:eye-closed-bold', B: 'ph:chat-teardrop-bold', C: 'ph:calendar-x-bold', D: 'ph:camera-bold' },
      7: { A: 'ph:mask-happy-bold', B: 'ph:crown-bold', C: 'ph:coins-bold', D: 'ph:crosshair-bold' },
      8: { A: 'ph:flag-bold', B: 'ph:calendar-blank-bold', C: 'ph:money-bold', D: 'ph:path-bold' },
      9: { A: 'ph:arrow-up-right-bold', B: 'ph:scales-bold', C: 'ph:eye-bold', D: 'ph:book-open-bold' },
      10: { A: 'ph:shield-check-bold', B: 'ph:airplane-tilt-bold', C: 'ph:trophy-bold', D: 'ph:house-line-bold' },
      11: { A: 'ph:map-pin-bold', B: 'ph:calculator-bold', C: 'ph:clock-user-bold', D: 'ph:chess-knight-bold' },
      12: { A: 'ph:arrows-clockwise-bold', B: 'ph:heart-straight-bold', C: 'ph:gear-bold', D: 'ph:signpost-bold' },
      13: { A: 'ph:signpost-bold', B: 'ph:wallet-bold', C: 'ph:microphone-bold', D: 'ph:list-checks-bold' }
    };

    const IMAGENS_FUNDO = [
      'https://images.unsplash.com/photo-1556761175-5973dc0f32b7?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1553729459-efe14ef6055d?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1499750310107-5fef28a66643?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1542744173-8e7e53415bb0?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1557804506-669a67965ba0?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1552664730-d307ca884978?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1507679799987-c73779587ccf?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1521737604893-d14cc237f11d?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1000&auto=format&fit=crop'
    ];

    function salvarLocal() {
      localStorage.setItem(LS_RESPOSTAS, JSON.stringify(state.respostas));
      localStorage.setItem('diag:indice', String(state.indice));
      localStorage.setItem(LS_INICIADO, state.iniciado ? '1' : '0');
    }

    function carregarLocal() {
      try {
        state.respostas = JSON.parse(localStorage.getItem(LS_RESPOSTAS) || '{}');
        const idx = parseInt(localStorage.getItem('diag:indice') || '0', 10);
        state.indice = Number.isFinite(idx) ? idx : 0;
        state.iniciado = localStorage.getItem(LS_INICIADO) === '1';
      } catch (err) {
        state.respostas = {};
        state.indice = 0;
        state.iniciado = false;
      }
    }

    function limparLocal() {
      localStorage.removeItem(LS_RESPOSTAS);
      localStorage.removeItem('diag:indice');
      localStorage.removeItem(LS_PERGUNTAS);
      localStorage.removeItem(LS_INICIADO);
      localStorage.removeItem(LS_NOME);
      localStorage.removeItem(LS_TELEFONE);
    }

    async function carregarPerguntas() {
      const cache = localStorage.getItem(LS_PERGUNTAS);
      if (cache) {
        try {
          const parsed = JSON.parse(cache);
          if (Array.isArray(parsed) && parsed.length > 0) {
            state.perguntas = parsed;
            return;
          }
        } catch (e) { /* ignorar */ }
      }

      const resposta = await fetch('/api/perguntas');

      // Valida se o servidor retornou JSON (evita quebrar se vier HTML)
      const contentType = resposta.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        throw new Error('O servidor não retornou JSON. Verifique se a API está no ar.');
      }

      if (!resposta.ok) throw new Error('Falha ao carregar perguntas (HTTP ' + resposta.status + ')');

      const data = await resposta.json();
      if (!data.sucesso || !Array.isArray(data.perguntas)) {
        throw new Error('Formato de resposta inválido.');
      }

      state.perguntas = data.perguntas;
      localStorage.setItem(LS_PERGUNTAS, JSON.stringify(data.perguntas));
    }

    function formatarAnalise(texto) {
      return texto
        .replace(/^## (.*$)/gim, '<h3>$1</h3>')
        .replace(/^---$/gim, '<hr>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .split('\n\n')
        .map(p => p.trim() ? `<p>${p.replace(/\n/g, '<br>')}</p>` : '')
        .join('');
    }

    function render() {
      // ─── TELA DE CARREGAMENTO MELHORADA ───
      if (state.carregando) {
        app.innerHTML = `
          <div class="loading-screen">
            <div class="loading-logo">
              <iconify-icon icon="ph:sparkle-bold"></iconify-icon>
              Clareza
            </div>
            <div class="loading-spinner"></div>
            <div class="loading-text">
              <h2>Preparando sua experiência</h2>
              <p>Estamos carregando as perguntas e ajustando tudo para você…</p>
            </div>
            <div class="loading-bar"></div>
          </div>
        `;
        return;
      }

      if (state.erro) {
        app.innerHTML = `
          <div class="intro">
            <h1>Ops, algo deu errado</h1>
            <div class="erro">${state.erro}</div>
            <button class="btn btn-full" id="btn-tentar-novamente">Tentar Novamente</button>
          </div>
        `;
        return;
      }

      if (state.analise) {
        app.innerHTML = `
          <div class="resultado">
            <div class="analise">${formatarAnalise(state.analise)}</div>
            <button class="btn btn-full" id="btn-reiniciar">Fazer novamente</button>
          </div>
        `;
        return;
      }

      if (!state.iniciado) {
        app.innerHTML = `
          <div class="intro">
            <div class="logo-top">
              <iconify-icon icon="ph:sparkle-bold"></iconify-icon> Clareza
            </div>
            <h1>Descubra a clareza<br>que seu negócio precisa.</h1>
            <p class="subtitle">Responda a algumas perguntas e receba uma análise personalizada para entender seus bloqueios, alinhar suas escolhas e encontrar o próximo passo.</p>

            <ul>
              <li><iconify-icon icon="ph:check-circle-bold"></iconify-icon> 13 perguntas rápidas</li>
              <li><iconify-icon icon="ph:check-circle-bold"></iconify-icon> Sem resposta "certa"</li>
              <li><iconify-icon icon="ph:check-circle-bold"></iconify-icon> Leva cerca de 5 minutos</li>
              <li><iconify-icon icon="ph:check-circle-bold"></iconify-icon> Seus dados estão seguros</li>
            </ul>

            <button class="btn btn-full" id="btn-comecar">Iniciar Minha Jornada <iconify-icon icon="ph:arrow-right-bold"></iconify-icon></button>
          </div>
        `;
        return;
      }

      if (state.indice >= state.perguntas.length) {
        app.innerHTML = `
          <div class="intro">
            <h1>Receber seu diagnóstico</h1>
            <p class="subtitle">Deixe seu nome e WhatsApp (opcional) para gerar a análise completa do seu perfil.</p>
            <div class="input-group">
              <input id="input-nome" class="input-field" type="text" placeholder="Seu nome" />
              <input id="input-telefone" class="input-field" type="tel" placeholder="WhatsApp (opcional)" />
            </div>
            <button class="btn btn-full" id="btn-enviar">Ver meu diagnóstico <iconify-icon icon="ph:sparkle-bold"></iconify-icon></button>
            <button id="btn-voltar" style="background:none;border:none;color:var(--muted);font-size:0.9rem;cursor:pointer;margin-top:24px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;">
              <iconify-icon icon="ph:arrow-left-bold"></iconify-icon> Voltar à última pergunta
            </button>
          </div>
        `;
        document.getElementById('input-nome').value = localStorage.getItem(LS_NOME) || '';
        document.getElementById('input-telefone').value = localStorage.getItem(LS_TELEFONE) || '';
        return;
      }

      const pergunta = state.perguntas[state.indice];
      const total = state.perguntas.length;
      const progresso = Math.round((state.indice / total) * 100);
      const bgImage = IMAGENS_FUNDO[state.indice % IMAGENS_FUNDO.length];

      const opcoesHtml = pergunta.opcoes.map((op) => {
        const icone = ICONES_PERGUNTAS[pergunta.numero]?.[op.letra] || 'ph:circle-bold';
        return `
          <button class="option" data-opcao-id="${op.id}">
            <div class="icon-box"><iconify-icon icon="${icone}"></iconify-icon></div>
            <span>${op.texto}</span>
          </button>
        `;
      }).join('');

      app.innerHTML = `
        <div class="question-container">
          <div class="header-question">
            <span>Pergunta ${state.indice + 1} de ${total}</span>
            <div class="bar-container">
              <div class="bar-fill" style="width: ${progresso}%"></div>
            </div>
          </div>

          <div class="question-image" style="background-image: url('${bgImage}')"></div>

          <div class="question">
            <h2>${pergunta.texto}</h2>
            <div class="options">${opcoesHtml}</div>
          </div>
        </div>
      `;
    }

    async function enviarFormulario() {
      const btn = document.getElementById('btn-enviar');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<div class="loading-spinner" style="width:20px;height:20px;border-width:2px;margin:0 8px 0 0;"></div> Analisando...';
      }

      const nome = document.getElementById('input-nome').value.trim();
      const telefone = document.getElementById('input-telefone').value.trim();
      localStorage.setItem(LS_NOME, nome);
      localStorage.setItem(LS_TELEFONE, telefone);

      const respostasIds = state.perguntas.map((p) => state.respostas[p.id]).filter(Boolean);

      try {
        const resposta = await fetch('/api/processar-formulario', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ respostasIds, nome, telefone }),
        });

        const contentType = resposta.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          throw new Error('Resposta inválida do servidor. Tente novamente.');
        }

        const data = await resposta.json();

        if (!resposta.ok || !data.sucesso) {
          throw new Error(data.erro || 'Erro ao processar o formulário.');
        }

        state.analise = data.analise;
        state.reutilizado = data.reutilizado;
        render();
      } catch (err) {
        state.erro = err.message;
        render();
      }
    }

    // ─── Botão invisível de reset ───
    document.getElementById('reset-btn').addEventListener('click', () => {
      const confirmar = confirm('Isso vai apagar todas as respostas e reiniciar o teste. Continuar?');
      if (!confirmar) return;
      limparLocal();
      location.reload();
    });

    app.addEventListener('click', (e) => {
      if (e.target.closest('#btn-comecar')) {
        state.iniciado = true;
        state.indice = 0;
        salvarLocal();
        render();
        return;
      }

      const btnOpcao = e.target.closest('.option');
      if (btnOpcao) {
        const pergunta = state.perguntas[state.indice];
        state.respostas[pergunta.id] = btnOpcao.dataset.opcaoId;
        state.indice += 1;
        salvarLocal();
        render();
        return;
      }

      if (e.target.closest('#btn-voltar')) {
        state.indice = state.perguntas.length - 1;
        render();
        return;
      }

      if (e.target.closest('#btn-enviar')) {
        enviarFormulario();
        return;
      }

      if (e.target.closest('#btn-reiniciar')) {
        limparLocal();
        state.iniciado = false;
        state.respostas = {};
        state.indice = 0;
        state.analise = null;
        state.reutilizado = null;
        state.erro = null;
        render();
        return;
      }

      if (e.target.closest('#btn-tentar-novamente')) {
        limparLocal();
        location.reload();
        return;
      }
    });

    (async function init() {
      carregarLocal();
      try {
        await carregarPerguntas();
        state.carregando = false;
        if (state.indice > state.perguntas.length) {
          state.indice = state.perguntas.length;
        }
      } catch (err) {
        state.carregando = false;
        state.erro = err.message;
      }
      render();
    })();
  </script>
</body>
</html>
