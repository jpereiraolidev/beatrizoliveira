<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnóstico de Clareza Empreendedora</title>
  
  <!-- Biblioteca de Ícones (Iconify) -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  
  <!-- Fonte Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0c0b;
      --card-bg: rgba(30, 25, 23, 0.85);
      --text: #f5f2f0;
      --muted: #a8a29e;
      --primary: #f97316; /* Laranja vibrante */
      --primary-hover: #ea580c;
      --secondary: #ef4444; /* Vermelho */
      --border: rgba(249, 115, 22, 0.2);
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.5;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(249, 115, 22, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(239, 68, 68, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* ─── Container Principal ─── */
    .app {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* ─── Tela Inicial ─── */
    .intro {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      animation: fadeInSlideUp 0.5s ease-out;
    }
    .intro h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      line-height: 1.2;
    }
    .intro p {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 1.05rem;
    }
    .intro .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(249, 115, 22, 0.1);
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 8px 16px;
      border-radius: 999px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    .intro ul {
      list-style: none;
      margin-bottom: 32px;
      width: 100%;
    }
    .intro ul li {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 12px;
      padding-left: 32px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .intro ul li iconify-icon {
      position: absolute;
      left: 0;
      color: var(--primary);
      font-size: 1.2rem;
    }

    /* ─── Pergunta ─── */
    .question-container {
      animation: fadeInSlideUp 0.4s ease-out;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    
    .header-question {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }
    
    .bar-container {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      margin-left: 16px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 999px;
    }

    .question-image {
      width: 100%;
      height: 160px;
      border-radius: 12px;
      margin-bottom: 24px;
      background-size: cover;
      background-position: center;
      position: relative;
      border: 1px solid var(--border);
    }
    .question-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, rgba(15, 12, 11, 0.8));
      border-radius: 12px;
    }

    .question h2 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 24px;
      line-height: 1.3;
      color: #fff;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      text-align: left;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 1rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      gap: 16px;
      align-items: center;
      font-family: inherit;
      position: relative;
      overflow: hidden;
    }
    .option:hover {
      background: rgba(249, 115, 22, 0.08);
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.15);
    }
    .option .icon-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: rgba(249, 115, 22, 0.1);
      border-radius: 10px;
      color: var(--primary);
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .option:hover .icon-box {
      background: var(--primary);
      color: #fff;
      transform: scale(1.05) rotate(5deg);
    }
    .option .icon-box iconify-icon {
      font-size: 1.4rem;
    }

    /* ─── Botões ─── */
    .btn {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 16px 32px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
      margin-top: 10px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(249, 115, 22, 0.5);
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-full { width: 100%; }

    /* ─── Inputs ─── */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    .input-field {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      font-family: inherit;
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      transition: border-color 0.2s;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(0, 0, 0, 0.4);
    }
    .input-field::placeholder { color: var(--muted); }

    /* ─── Resultado ─── */
    .resultado {
      animation: fadeInSlideUp 0.5s ease-out;
    }
    .resultado .analise {
      color: var(--text);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .resultado .analise h3 {
      color: var(--primary);
      font-size: 1.4rem;
      margin-top: 24px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .resultado .analise p {
      margin-bottom: 16px;
    }
    .resultado .analise strong {
      color: #fff;
      font-weight: 700;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .resultado .analise hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }
    .resultado .analise em {
      color: var(--muted);
    }

    /* ─── Loading / Erro ─── */
    .center {
      text-align: center;
      margin: auto;
      color: var(--muted);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(249, 115, 22, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .erro {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    /* ─── Animações ─── */
    @keyframes fadeInSlideUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .app { padding: 24px; }
      .intro h1 { font-size: 1.6rem; }
      .question h2 { font-size: 1.2rem; }
      .question-image { height: 120px; }
    }
  </style>
</head>
<body>
  <main class="app" id="app"></main>

  <script>
    const LS_PERGUNTAS = 'diag:perguntas';
    const LS_RESPOSTAS = 'diag:respostas';
    const LS_NOME = 'diag:nome';
    const LS_TELEFONE = 'diag:telefone';
    const LS_INICIADO = 'diag:iniciado';

    const state = {
      iniciado: false,
      perguntas: [],
      indice: 0,
      respostas: {},
      carregando: true,
      erro: null,
      analise: null,
      reutilizado: null,
    };

    const app = document.getElementById('app');

    // Ícones para cada alternativa (A, B, C, D) de cada uma das 13 perguntas
    const ICONES_PERGUNTAS = {
      1: { A: 'ph:anchor-bold', B: 'ph:stack-bold', C: 'ph:lightbulb-bold', D: 'ph:trend-up-bold' },
      2: { A: 'ph:users-bold', B: 'ph:currency-dollar-bold', C: 'ph:megaphone-bold', D: 'ph:compass-bold' },
      3: { A: 'ph:hourglass-bold', B: 'ph:fire-bold', C: 'ph:target-bold', D: 'ph:rocket-launch-bold' },
      4: { A: 'ph:clock-bold', B: 'ph:lightning-bold', C: 'ph:brain-bold', D: 'ph:check-circle-bold' },
      5: { A: 'ph:funnel-bold', B: 'ph:receipt-bold', C: 'ph:chart-line-up-bold', D: 'ph:bank-bold' },
      6: { A: 'ph:eye-closed-bold', B: 'ph:chat-teardrop-bold', C: 'ph:calendar-x-bold', D: 'ph:camera-bold' },
      7: { A: 'ph:mask-happy-bold', B: 'ph:crown-bold', C: 'ph:coins-bold', D: 'ph:crosshair-bold' },
      8: { A: 'ph:flag-bold', B: 'ph:calendar-blank-bold', C: 'ph:money-bold', D: 'ph:path-bold' },
      9: { A: 'ph:arrow-up-right-bold', B: 'ph:scales-bold', C: 'ph:eye-bold', D: 'ph:book-open-bold' },
      10: { A: 'ph:shield-check-bold', B: 'ph:airplane-tilt-bold', C: 'ph:trophy-bold', D: 'ph:house-line-bold' },
      11: { A: 'ph:map-pin-bold', B: 'ph:calculator-bold', C: 'ph:clock-user-bold', D: 'ph:chess-knight-bold' },
      12: { A: 'ph:arrows-clockwise-bold', B: 'ph:heart-straight-bold', C: 'ph:gear-bold', D: 'ph:signpost-bold' },
      13: { A: 'ph:signpost-bold', B: 'ph:wallet-bold', C: 'ph:microphone-bold', D: 'ph:list-checks-bold' }
    };

    // Imagens de fundo para cada pergunta (Unsplash)
    const IMAGENS_FUNDO = [
      'https://images.unsplash.com/photo-1556761175-5973dc0f32b7?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1553729459-efe14ef6055d?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1499750310107-5fef28a66643?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1542744173-8e7e53415bb0?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1557804506-669a67965ba0?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1552664730-d307ca884978?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1507679799987-c73779587ccf?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1521737604893-d14cc237f11d?q=80&w=1000&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1000&auto=format&fit=crop'
    ];

    function salvarLocal() {
      localStorage.setItem(LS_RESPOSTAS, JSON.stringify(state.respostas));
      localStorage.setItem('diag:indice', String(state.indice));
      localStorage.setItem(LS_INICIADO, state.iniciado ? '1' : '0');
    }
    
    function carregarLocal() {
      try {
        state.respostas = JSON.parse(localStorage.getItem(LS_RESPOSTAS) || '{}');
        const idx = parseInt(localStorage.getItem('diag:indice') || '0', 10);
        state.indice = Number.isFinite(idx) ? idx : 0;
        state.iniciado = localStorage.getItem(LS_INICIADO) === '1';
      } catch (err) {
        state.respostas = {};
        state.indice = 0;
        state.iniciado = false;
      }
    }
    
    function limparLocal() {
      localStorage.removeItem(LS_RESPOSTAS);
      localStorage.removeItem('diag:indice');
      localStorage.removeItem(LS_PERGUNTAS);
      localStorage.removeItem(LS_INICIADO);
    }

    async function carregarPerguntas() {
      const cache = localStorage.getItem(LS_PERGUNTAS);
      if (cache) {
        try {
          const parsed = JSON.parse(cache);
          if (Array.isArray(parsed) && parsed.length > 0) {
            state.perguntas = parsed;
            return;
          }
        } catch (e) { /* ignorar */ }
      }

      const resposta = await fetch('/api/perguntas');
      if (!resposta.ok) throw new Error('Falha ao carregar perguntas (HTTP ' + resposta.status + ')');
      
      const data = await resposta.json();
      if (!data.sucesso || !Array.isArray(data.perguntas)) {
        throw new Error('Formato de resposta inválido.');
      }

      state.perguntas = data.perguntas;
      localStorage.setItem(LS_PERGUNTAS, JSON.stringify(data.perguntas));
    }

    function formatarAnalise(texto) {
      return texto
        .replace(/^## (.*$)/gim, '<h3>$1</h3>')
        .replace(/^---$/gim, '<hr>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .split('\n\n')
        .map(p => p.trim() ? `<p>${p.replace(/\n/g, '<br>')}</p>` : '')
        .join('');
    }

    function render() {
      if (state.carregando) {
        app.innerHTML = `<div class="center"><div class="spinner"></div><p>Preparando sua experiência…</p></div>`;
        return;
      }

      if (state.erro) {
        app.innerHTML = `
          <div class="intro">
            <h1>Ops, algo deu errado</h1>
            <div class="erro">${state.erro}</div>
            <button class="btn btn-full" onclick="localStorage.clear(); location.reload()">Tentar Novamente</button>
          </div>
        `;
        return;
      }

      if (state.analise) {
        app.innerHTML = `
          <div class="resultado">
            <div class="analise">${formatarAnalise(state.analise)}</div>
            <button class="btn btn-full" id="btn-reiniciar">Fazer novamente</button>
          </div>
        `;
        return;
      }

      if (!state.iniciado) {
        app.innerHTML = `
          <div class="intro">
            <span class="badge"><iconify-icon icon="ph:sparkle-bold"></iconify-icon> 13 perguntas · 4 alternativas</span>
            <h1>Antes de crescer, entenda onde você está.</h1>
            <p>Uma experiência de reflexão profunda sobre seu negócio, suas decisões, suas dificuldades e o futuro que deseja construir.</p>
            <ul>
              <li><iconify-icon icon="ph:check-circle-bold"></iconify-icon> Uma pergunta por tela</li>
              <li><iconify-icon icon="ph:check-circle-bold"></iconify-icon> Sem resposta "certa" — responda com sua realidade</li>
              <li><iconify-icon icon="ph:check-circle-bold"></iconify-icon> Leva cerca de 5 minutos</li>
            </ul>
            <button class="btn btn-full" id="btn-comecar">Começar Diagnóstico <iconify-icon icon="ph:arrow-right-bold"></iconify-icon></button>
          </div>
        `;
        return;
      }

      if (state.indice >= state.perguntas.length) {
        app.innerHTML = `
          <div class="intro">
            <span class="badge"><iconify-icon icon="ph:rocket-launch-bold"></iconify-icon> Quase lá</span>
            <h1>Receber seu diagnóstico</h1>
            <p>Deixe seu nome e WhatsApp (opcional) para gerar a análise completa do seu perfil.</p>
            <div class="input-group">
              <input id="input-nome" class="input-field" type="text" placeholder="Seu nome" />
              <input id="input-telefone" class="input-field" type="tel" placeholder="WhatsApp (opcional)" />
            </div>
            <button class="btn btn-full" id="btn-enviar">Ver meu diagnóstico <iconify-icon icon="ph:sparkle-bold"></iconify-icon></button>
            <button id="btn-voltar" style="background:none;border:none;color:var(--muted);font-size:0.9rem;cursor:pointer;margin-top:16px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px;width:100%;">
              <iconify-icon icon="ph:arrow-left-bold"></iconify-icon> Voltar à última pergunta
            </button>
          </div>
        `;
        document.getElementById('input-nome').value = localStorage.getItem(LS_NOME) || '';
        document.getElementById('input-telefone').value = localStorage.getItem(LS_TELEFONE) || '';
        return;
      }

      const pergunta = state.perguntas[state.indice];
      const total = state.perguntas.length;
      const progresso = Math.round((state.indice / total) * 100);
      const bgImage = IMAGENS_FUNDO[state.indice % IMAGENS_FUNDO.length];

      const opcoesHtml = pergunta.opcoes.map((op) => {
        const icone = ICONES_PERGUNTAS[pergunta.numero]?.[op.letra] || 'ph:circle-bold';
        return `
          <button class="option" data-opcao-id="${op.id}">
            <div class="icon-box"><iconify-icon icon="${icone}"></iconify-icon></div>
            <span>${op.texto}</span>
          </button>
        `;
      }).join('');

      app.innerHTML = `
        <div class="question-container">
          <div class="header-question">
            <span>Pergunta ${state.indice + 1} de ${total}</span>
            <div class="bar-container">
              <div class="bar-fill" style="width: ${progresso}%"></div>
            </div>
          </div>
          
          <div class="question-image" style="background-image: url('${bgImage}')"></div>
          
          <div class="question">
            <h2>${pergunta.texto}</h2>
            <div class="options">${opcoesHtml}</div>
          </div>
        </div>
      `;
    }

    async function enviarFormulario() {
      const btn = document.getElementById('btn-enviar');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px;margin:0 8px 0 0;"></div> Analisando...';
      }

      const nome = document.getElementById('input-nome').value.trim();
      const telefone = document.getElementById('input-telefone').value.trim();
      localStorage.setItem(LS_NOME, nome);
      localStorage.setItem(LS_TELEFONE, telefone);

      const respostasIds = state.perguntas.map((p) => state.respostas[p.id]).filter(Boolean);

      try {
        const resposta = await fetch('/api/processar-formulario', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ respostasIds, nome, telefone }),
        });

        const data = await resposta.json();

        if (!resposta.ok || !data.sucesso) {
          throw new Error(data.erro || 'Erro ao processar o formulário.');
        }

        state.analise = data.analise;
        state.reutilizado = data.reutilizado;
        render();
      } catch (err) {
        state.erro = err.message;
        render();
      }
    }

    app.addEventListener('click', (e) => {
      if (e.target.closest('#btn-comecar')) {
        state.iniciado = true;
        state.indice = 0;
        salvarLocal();
        render();
        return;
      }

      const btnOpcao = e.target.closest('.option');
      if (btnOpcao) {
        const pergunta = state.perguntas[state.indice];
        state.respostas[pergunta.id] = btnOpcao.dataset.opcaoId;
        state.indice += 1;
        salvarLocal();
        render();
        return;
      }

      if (e.target.closest('#btn-voltar')) {
        state.indice = state.perguntas.length - 1;
        render();
        return;
      }

      if (e.target.closest('#btn-enviar')) {
        enviarFormulario();
        return;
      }

      if (e.target.closest('#btn-reiniciar')) {
        limparLocal();
        state.iniciado = false;
        state.respostas = {};
        state.indice = 0;
        state.analise = null;
        state.reutilizado = null;
        state.erro = null;
        render();
        return;
      }
    });

    (async function init() {
      carregarLocal();
      try {
        await carregarPerguntas();
        state.carregando = false;
        if (state.indice > state.perguntas.length) {
           state.indice = state.perguntas.length;
        }
      } catch (err) {
        state.carregando = false;
        state.erro = err.message;
      }
      render();
    })();
  </script>
</body>
</html>
